name: validate-spec

# 명세가 깨진 채로 커밋되는 것을 막는다.
# 문서 형식·스키마·E2E fixture·Canonical Data Model·전역 Entity 관계 불변식을 함께 검증한다.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install jsonschema referencing

      - name: JSON Schema 파싱
        run: |
          python3 -c "import json,glob,sys; [json.load(open(f)) for f in glob.glob('intent-os-spec/schemas/*.json')]"

      - name: 형식 검증 (섹션 · 번호 · 스키마 위생)
        run: python3 tools/validate-format.py

      - name: 예시 검증 (JSON 예시 ↔ 스키마)
        run: python3 tools/validate-examples.py

      - name: System Routing Benchmark 검증
        run: python3 tools/validate-system-benchmark.py

      - name: Benchmark scorer smoke test
        run: |
          python3 -m py_compile tools/score-system-benchmark.py
          python3 tools/score-system-benchmark.py benchmarks/examples/system-routing-run.example.json --json > /dev/null

      - name: End-to-End Golden Fixture 검증
        run: python3 tools/validate-e2e-fixtures.py

      - name: Canonical Data Model 검증
        run: python3 tools/validate-canonical.py

      - name: Thin Reference E2E + canonical schema 검사
        run: python3 -m unittest discover -s reference/marketing_thin/tests -v

      - name: 전역 불변식 검사기 테스트
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: 전역 불변식 정상 체인 검증
        run: python3 tools/validate-invariants.py tests/invariants/valid-chain.json

      - name: End-to-End × 전역 불변식 16/16 검증
        run: python3 tools/validate-e2e-invariants.py --require-all-covered

      - name: 상대 링크 검사
        run: python3 tools/validate-links.py
