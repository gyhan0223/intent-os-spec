name: validate-spec

# 명세가 깨진 채로 커밋되는 것을 막는다.
#
# 검사 목록을 여기에 두지 않는다. `tools/validate-all.py`가 저장소에서
# 검사를 자동 발견한다 — `tools/validate-*.py`와 `test_*.py`를 담은
# `tests/` 디렉터리.
#
# 이유: 검사마다 스텝을 두면 여러 작업이 병렬로 진행될 때 전부 이 파일
# 같은 자리에 스텝을 덧붙여 매번 충돌한다. 그 충돌을 "한쪽 선택"으로
# 풀면 이미 머지된 검사가 CI에서 조용히 사라진다. 파일은 남고 검사만
# 없어지니 눈에 띄지도 않는다.
#
# 새 검사를 추가할 때 이 파일을 고치지 않는다. `tools/validate-*.py`를
# 하나 더 놓으면 그만이다. 인자가 필요하면 그 파일 안에서 선언한다.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install jsonschema referencing

      - name: 전체 검증 (자동 발견)
        run: python3 tools/validate-all.py
